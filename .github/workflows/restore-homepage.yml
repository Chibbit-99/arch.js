name: Restore homepage

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Add docs link to homepage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore homepage and add docs link
        run: |
          git checkout 4c7a4177a368491bd55128dbf958a7b2955f40c7 -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          needle = '<li><a href="#why" class="active">Why</a></li>'
          replacement = needle + '<li><a href="docs/">Docs</a></li>'
          if 'href="docs/"' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/restore-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-homepage.yml
          git commit -m "Add docs link to homepage"
          git push origin HEAD:main

# trigger