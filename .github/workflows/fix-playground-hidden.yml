name: One-time playground visibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run targeted playground visibility fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hidden playground elements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '.package-demo{'
          if marker not in s:
              raise SystemExit('playground not found')
          rule = '.package-demo [hidden]{display:none!important}'
          if rule not in s:
              s = s.replace(marker, rule + marker, 1)
          if 'contenteditable="false"' in s:
              pass
          s = s.replace('revelant files', 'relevant files')
          p.write_text(s)
          PY
          git diff --check
          grep -q '.package-demo \[hidden\]{display:none!important}' index.html
          ! grep -q 'revelant files' index.html
          git config user.name "ARCH.js updater"
          git config user.email "arch-updater@localhost"
          git add index.html
          git rm .github/workflows/fix-playground-hidden.yml
          git commit -m "Fix playground hidden element layout"
          git push origin HEAD:main
