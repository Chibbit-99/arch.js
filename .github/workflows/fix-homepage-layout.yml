name: One-time homepage layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run targeted homepage layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          if '.package-demo{' not in s:
              raise SystemExit('package playground not found')

          s = s.replace(
              '.package-grid{display:grid;grid-template-columns:1fr 1fr}',
              '.package-grid{display:grid;grid-template-columns:1fr}'
          )
          s = s.replace(
              '.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-right:1px solid rgba(241,235,227,.09)}',
              '.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-bottom:1px solid rgba(241,235,227,.09)}'
          )

          footer_css = 'footer{border-top:1px solid rgba(241,235,227,.09);padding:56px 20px}.footer-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:42px}.footer-title{font-weight:600;color:#F1EBE3;margin-bottom:12px}.footer-grid a{display:block;color:#C9BFB2;font-size:14px;margin:7px 0}.footer-grid a:hover{color:#C6613F}.footer-note{font-size:12px;color:#8F8477}'
          if 'footer{border-top:1px solid rgba(241,235,227,.09)' not in s:
              s = s.replace('.package-demo{', footer_css + '\n.package-demo{', 1)

          scrollbar_css = '''
          .code-window,.terminal,.compiled-output{scrollbar-width:thin;scrollbar-color:rgba(198,97,63,.55) rgba(20,18,15,.5)}
          .code-window::-webkit-scrollbar,.terminal::-webkit-scrollbar,.compiled-output::-webkit-scrollbar{width:9px;height:9px}
          .code-window::-webkit-scrollbar-track,.terminal::-webkit-scrollbar-track,.compiled-output::-webkit-scrollbar-track{background:rgba(20,18,15,.5)}
          .code-window::-webkit-scrollbar-thumb,.terminal::-webkit-scrollbar-thumb,.compiled-output::-webkit-scrollbar-thumb{background:rgba(198,97,63,.45);border:2px solid rgba(20,18,15,.5);border-radius:999px}
          .code-window::-webkit-scrollbar-thumb:hover,.terminal::-webkit-scrollbar-thumb:hover,.compiled-output::-webkit-scrollbar-thumb:hover{background:rgba(198,97,63,.7)}
          '''
          if '.code-window::-webkit-scrollbar' not in s:
              s = s.replace('</style>', scrollbar_css + '</style>', 1)

          s = s.replace(
              '@media(max-width:900px){.nav-links{display:none}.showcase{grid-template-columns:1fr}.code-side{border-right:0;border-bottom:1px solid rgba(241,235,227,.09)}.code-window{height:540px}.demo-frame-wrap{min-height:420px}.demo-frame{min-height:376px}.twocol,.updates{grid-template-columns:1fr}.twocol>div{border-right:0;border-bottom:1px solid rgba(241,235,227,.09);padding:0 0 28px}.cards{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}.package-grid{grid-template-columns:1fr}.terminal-panel{border-right:0;border-bottom:1px solid rgba(241,235,227,.09)}}',
              '@media(max-width:900px){.nav-links{display:none}.showcase{grid-template-columns:1fr}.code-side{border-right:0;border-bottom:1px solid rgba(241,235,227,.09)}.code-window{height:540px}.demo-frame-wrap{min-height:420px}.demo-frame{min-height:376px}.twocol,.updates{grid-template-columns:1fr}.twocol>div{border-right:0;border-bottom:1px solid rgba(241,235,227,.09);padding:0 0 28px}.cards{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}}'
          )

          p.write_text(s)
          PY

          git diff --check
          grep -q '.package-grid{display:grid;grid-template-columns:1fr}' index.html
          grep -q 'footer{border-top:1px solid rgba(241,235,227,.09)' index.html
          grep -q '.code-window::-webkit-scrollbar' index.html

          git config user.name "ARCH.js updater"
          git config user.email "arch-updater@localhost"
          git add index.html
          git rm .github/workflows/fix-homepage-layout.yml
          git commit -m "Fix homepage playground and footer layout"
          git push origin HEAD:main
