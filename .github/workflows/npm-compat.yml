name: ARCH.js npm Compatibility Lab

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save playwright all-the-package-names
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          node <<'EOF'
          const fs = require("fs");
          const packages = require("all-the-package-names");

          fs.writeFileSync(
            "packages.json",
            JSON.stringify(packages)
          );

          console.log(
            `Found ${packages.length} npm packages`
          );
          EOF

      - name: Select next 5000 packages
        run: |
          node <<'EOF'
          const fs = require("fs");

          const packages = JSON.parse(
            fs.readFileSync("packages.json", "utf8")
          );

          let offset = 0;

          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(
              fs.readFileSync("progress.json", "utf8")
            );

            offset = progress.offset || 0;
          }

          const batch = packages.slice(
            offset,
            offset + 5000
          );

          fs.writeFileSync(
            "batch.json",
            JSON.stringify(batch)
          );

          console.log(
            `Testing packages ${offset + 1}-${offset + batch.length} of ${packages.length}`
          );

          console.log(
            `Batch size: ${batch.length}`
          );
          EOF

      - name: Test packages
        run: |
          node <<'EOF'
          (async () => {
            const fs = require("fs");
            const http = require("http");
            const { chromium } = require("playwright");

            const packages = JSON.parse(
              fs.readFileSync("batch.json", "utf8")
            );

            if (packages.length === 0) {
              console.log("No packages left to test.");

              const currentIndex = fs.existsSync("progress.json")
                ? (
                    JSON.parse(
                      fs.readFileSync(
                        "progress.json",
                        "utf8"
                      )
                    ).offset || 0
                  )
                : 0;

              fs.writeFileSync(
                "results.json",
                JSON.stringify(
                  {
                    packagetestedindex: currentIndex,
                    working: [],
                    working_count: 0
                  },
                  null,
                  2
                ) + "\n"
              );

              return;
            }

            const CONCURRENCY = 8;

            let nextIndex = 0;
            const working = [];

            const server = http.createServer(
              (req, res) => {
                try {
                  const url = new URL(
                    req.url,
                    "http://127.0.0.1:4173"
                  );

                  const packageName =
                    url.searchParams.get("package");

                  if (!packageName) {
                    res.writeHead(400);
                    res.end("Missing package");
                    return;
                  }

                  const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <script src="https://chibbit-99.github.io/arch.js/releases/latest.js"></script>
          </head>
          <body>
            <script type="module">
              window.__ARCH_DONE__ = false;
              window.__ARCH_WORKING__ = false;

              (async () => {
                try {
                  await importPackage(
                    ${JSON.stringify(packageName)}
                  );

                  window.__ARCH_WORKING__ = true;
                } catch (error) {
                  window.__ARCH_WORKING__ = false;
                }

                window.__ARCH_DONE__ = true;
              })();
            </script>
          </body>
          </html>`;

                  res.writeHead(200, {
                    "Content-Type": "text/html"
                  });

                  res.end(html);
                } catch (error) {
                  res.writeHead(500);
                  res.end("Server error");
                }
              }
            );

            await new Promise(
              (resolve, reject) => {
                server.once("error", reject);

                server.listen(
                  4173,
                  "127.0.0.1",
                  resolve
                );
              }
            );

            const browser =
              await chromium.launch({
                headless: true
              });

            async function worker(workerId) {
              while (true) {
                const index = nextIndex++;

                if (index >= packages.length) {
                  return;
                }

                const packageName =
                  packages[index];

                let page = null;

                console.log(
                  `[Worker ${workerId}] ${index + 1}/${packages.length} ${packageName}`
                );

                try {
                  page =
                    await browser.newPage();

                  await page.goto(
                    `http://127.0.0.1:4173/?package=${encodeURIComponent(packageName)}`,
                    {
                      waitUntil:
                        "domcontentloaded",
                      timeout: 30000
                    }
                  );

                  await page.waitForFunction(
                    () =>
                      window.__ARCH_DONE__ === true,
                    {
                      timeout: 60000
                    }
                  );

                  const result =
                    await page.evaluate(
                      () => ({
                        working:
                          window.__ARCH_WORKING__
                      })
                    );

                  if (result.working) {
                    working.push(packageName);

                    console.log(
                      `[Worker ${workerId}] WORKS ${packageName}`
                    );
                  } else {
                    console.log(
                      `[Worker ${workerId}] FAIL ${packageName}`
                    );
                  }

                } catch (error) {
                  console.log(
                    `[Worker ${workerId}] ERROR ${packageName}`
                  );
                } finally {
                  if (page) {
                    await page.close();
                  }
                }
              }
            }

            await Promise.all(
              Array.from(
                {
                  length: Math.min(
                    CONCURRENCY,
                    packages.length
                  )
                },
                (_, index) =>
                  worker(index + 1)
              )
            );

            await browser.close();
            server.close();

            const previousOffset =
              fs.existsSync("progress.json")
                ? (
                    JSON.parse(
                      fs.readFileSync(
                        "progress.json",
                        "utf8"
                      )
                    ).offset || 0
                  )
                : 0;

            const newOffset =
              previousOffset + packages.length;

            const result = {
              packagetestedindex:
                newOffset,

              working,

              working_count:
                working.length
            };

            fs.writeFileSync(
              "results.json",
              JSON.stringify(
                result,
                null,
                2
              ) + "\n"
            );

            fs.writeFileSync(
              "progress.json",
              JSON.stringify(
                {
                  offset: newOffset
                },
                null,
                2
              ) + "\n"
            );

            console.log("");
            console.log(
              "=============================="
            );
            console.log(
              `Tested: ${packages.length}`
            );
            console.log(
              `Working: ${working.length}`
            );
            console.log(
              `Index: ${newOffset}`
            );
            console.log(
              "=============================="
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.json progress.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit \
              -m "chore: update ARCH.js npm compatibility"

            git push
          fi
