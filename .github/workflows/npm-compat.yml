name: ARCH.js npm Compatibility Lab

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save playwright all-the-package-names
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = require("all-the-package-names");
          fs.writeFileSync("packages.json", JSON.stringify(packages));
          console.log(`Found ${packages.length} npm packages`);
          NODE

      - name: Select next 5000 packages
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = JSON.parse(fs.readFileSync("packages.json", "utf8"));
          let offset = 0;
          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(fs.readFileSync("progress.json", "utf8"));
            offset = Number(progress.offset) || 0;
          }
          const batch = packages.slice(offset, offset + 5000);
          fs.writeFileSync("batch.json", JSON.stringify(batch));
          console.log(`Starting at package index: ${offset}`);
          console.log(`Batch size: ${batch.length}`);
          console.log(`Range: ${offset + 1}-${offset + batch.length}`);
          NODE

      - name: Create compatibility tester
        run: |
          cat > tester.cjs <<'NODE'
          const fs = require("fs");
          const http = require("http");
          const { chromium } = require("playwright");

          const ARCH_BASE = "https://chibbit-99.github.io/arch.js/";
          const CONCURRENCY = 2;
          const PACKAGES_PER_BROWSER = 50;
          const SANITY_PACKAGE = "02-webpack-numbers-gx";

          function encodePackage(name) {
            return Buffer.from(name, "utf8").toString("base64url");
          }

          function decodePackage(value) {
            return Buffer.from(value, "base64url").toString("utf8");
          }

          function classifyFailure(result) {
            const error = String(result.error || "");
            const allText = [
              error,
              ...(result.consoleErrors || []),
              ...(result.pageErrors || []),
              ...(result.failedRequests || [])
            ].join("\n");

            if (/Cannot resolve package entry/i.test(error)) return "unresolvable";
            if (/Node builtin|Node-only code|Could not resolve|Module not found/i.test(error)) return "incompatible";
            if (result.failedRequests?.length) return "network";
            if (/\b(408|429|500|502|503|504)\b|Failed to fetch|NetworkError|net::/i.test(allText)) return "network";
            if (/\b404\b/i.test(allText)) return "resource_error";
            return "incompatible";
          }

          async function testPackage(browser, packageName) {
            const context = await browser.newContext();
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];

            page.on("pageerror", error => {
              pageErrors.push(String(error?.stack || error));
            });

            page.on("console", message => {
              if (message.type() === "error") {
                consoleErrors.push(message.text());
              }
            });

            page.on("response", response => {
              if (response.status() >= 400) {
                consoleErrors.push(`${response.status()} ${response.url()}`);
              }
            });

            page.on("requestfailed", request => {
              failedRequests.push(`${request.url()}: ${request.failure()?.errorText || "unknown error"}`);
            });

            try {
              const encoded = encodePackage(packageName);
              await page.goto(
                `http://127.0.0.1:4173/test/${encoded}`,
                { waitUntil: "domcontentloaded", timeout: 30000 }
              );

              await page.waitForFunction(
                () => window.__ARCH_RESULT__ && window.__ARCH_RESULT__.done === true,
                { timeout: 60000 }
              );

              return await page.evaluate(
                ({ consoleErrors, pageErrors, failedRequests }) => ({
                  ...window.__ARCH_RESULT__,
                  consoleErrors,
                  pageErrors,
                  failedRequests
                }),
                { consoleErrors, pageErrors, failedRequests }
              );
            } finally {
              await page.close();
              await context.close();
            }
          }

          async function launchAndSanityCheck() {
            const browser = await chromium.launch({ headless: true });
            const sanity = await testPackage(browser, SANITY_PACKAGE);

            if (sanity.packageName === SANITY_PACKAGE && sanity.working) {
              console.log("SANITY CHECK PASSED");
              return browser;
            }

            console.error("SANITY CHECK FAILED:", JSON.stringify(sanity, null, 2));
            await browser.close();

            console.log("Starting a completely fresh browser for sanity retry...");
            const retryBrowser = await chromium.launch({ headless: true });
            const retry = await testPackage(retryBrowser, SANITY_PACKAGE);

            if (retry.packageName === SANITY_PACKAGE && retry.working) {
              console.log("SANITY RETRY PASSED");
              return retryBrowser;
            }

            console.error("SANITY RETRY FAILED:", JSON.stringify(retry, null, 2));
            await retryBrowser.close();
            throw new Error("ARCH.js test environment failed the known-good package twice in fresh browsers.");
          }

          async function main() {
            const packages = JSON.parse(fs.readFileSync("batch.json", "utf8"));

            if (packages.length === 0) {
              console.log("No packages left to test.");
              return;
            }

            const working = [];
            const failures = [];
            let nextIndex = 0;

            const server = http.createServer((req, res) => {
              try {
                const url = new URL(req.url, "http://127.0.0.1:4173");
                if (!url.pathname.startsWith("/test/")) {
                  res.writeHead(404);
                  res.end("Not found");
                  return;
                }

                const packageName = decodePackage(url.pathname.slice("/test/".length));
                const html = `<!DOCTYPE html>
          <html><head><meta charset="UTF-8"><base href="${ARCH_BASE}"><script src="${ARCH_BASE}releases/latest.js"></script></head>
          <body><script type="module">
          window.__ARCH_RESULT__ = { done:false, working:false, packageName:${JSON.stringify(packageName)}, error:null };
          (async () => {
            try {
              await importPackage(${JSON.stringify(packageName)});
              window.__ARCH_RESULT__ = { done:true, working:true, packageName:${JSON.stringify(packageName)}, error:null };
            } catch (error) {
              window.__ARCH_RESULT__ = {
                done:true,
                working:false,
                packageName:${JSON.stringify(packageName)},
                error:String(error?.stack || error?.message || error).slice(0,10000)
              };
            }
          })();
          </script></body></html>`;

                res.writeHead(200, { "Content-Type": "text/html" });
                res.end(html);
              } catch (error) {
                res.writeHead(500);
                res.end(String(error));
              }
            });

            await new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(4173, "127.0.0.1", resolve);
            });

            console.log("Local test server started.");

            async function worker(workerId) {
              let browser = await launchAndSanityCheck();
              let packagesOnBrowser = 0;

              try {
                while (true) {
                  const index = nextIndex++;
                  if (index >= packages.length) return;

                  if (packagesOnBrowser >= PACKAGES_PER_BROWSER) {
                    console.log(`[Worker ${workerId}] Restarting Chromium after ${packagesOnBrowser} packages`);
                    await browser.close();
                    browser = await launchAndSanityCheck();
                    packagesOnBrowser = 0;
                  }

                  const packageName = packages[index];
                  console.log(`[Worker ${workerId}] ${index + 1}/${packages.length} ${packageName}`);

                  let result;
                  try {
                    result = await testPackage(browser, packageName);
                  } catch (error) {
                    result = {
                      done: true,
                      working: false,
                      packageName,
                      error: String(error?.stack || error),
                      consoleErrors: [],
                      pageErrors: [],
                      failedRequests: []
                    };
                  }

                  packagesOnBrowser++;

                  if (result.packageName !== packageName) {
                    result.working = false;
                    result.error = `Package name mismatch: expected "${packageName}", got "${result.packageName}"`;
                  }

                  if (result.working) {
                    working.push(packageName);
                    console.log(`[Worker ${workerId}] WORKS ${packageName}`);
                  } else {
                    const failureType = classifyFailure(result);
                    console.log(`[Worker ${workerId}] FAIL ${packageName} [${failureType}]`);
                    console.log(`[Worker ${workerId}] ERROR ${packageName}: ${result.error || "unknown error"}`);

                    if (result.consoleErrors?.length) {
                      console.log(`[Worker ${workerId}] HTTP/CONSOLE ${packageName}: ${JSON.stringify(result.consoleErrors)}`);
                    }
                    if (result.pageErrors?.length) {
                      console.log(`[Worker ${workerId}] PAGE ERRORS ${packageName}: ${JSON.stringify(result.pageErrors)}`);
                    }
                    if (result.failedRequests?.length) {
                      console.log(`[Worker ${workerId}] FAILED REQUESTS ${packageName}: ${JSON.stringify(result.failedRequests)}`);
                    }

                    failures.push({
                      package: packageName,
                      type: failureType,
                      error: result.error || "unknown error",
                      consoleErrors: result.consoleErrors || [],
                      pageErrors: result.pageErrors || [],
                      failedRequests: result.failedRequests || []
                    });
                  }
                }
              } finally {
                await browser.close();
              }
            }

            try {
              await Promise.all(
                Array.from(
                  { length: Math.min(CONCURRENCY, packages.length) },
                  (_, index) => worker(index + 1)
                )
              );
            } finally {
              server.close();
            }

            let previousOffset = 0;
            if (fs.existsSync("progress.json")) {
              const progress = JSON.parse(fs.readFileSync("progress.json", "utf8"));
              previousOffset = Number(progress.offset) || 0;
            }

            const newOffset = previousOffset + packages.length;
            const counts = {
              incompatible: failures.filter(x => x.type === "incompatible").length,
              unresolvable: failures.filter(x => x.type === "unresolvable").length,
              network: failures.filter(x => x.type === "network").length,
              resource_error: failures.filter(x => x.type === "resource_error").length
            };

            fs.writeFileSync(
              "results.json",
              JSON.stringify({
                packagetestedindex: newOffset,
                working,
                working_count: working.length,
                failed: failures.map(x => x.package),
                failed_count: failures.length,
                failure_counts: counts,
                errors: failures
              }, null, 2) + "\n"
            );

            fs.writeFileSync(
              "progress.json",
              JSON.stringify({ offset: newOffset }, null, 2) + "\n"
            );

            console.log("\n================================");
            console.log("ARCH.js COMPATIBILITY RESULTS");
            console.log("================================");
            console.log(`Tested:        ${packages.length}`);
            console.log(`Working:       ${working.length}`);
            console.log(`Failed:        ${failures.length}`);
            console.log(`Incompatible:  ${counts.incompatible}`);
            console.log(`Unresolvable:  ${counts.unresolvable}`);
            console.log(`Network:       ${counts.network}`);
            console.log(`Resource:      ${counts.resource_error}`);
            console.log(`Index:         ${newOffset}`);
            console.log("================================");

            if (failures.length) {
              console.log("\nFailure samples:");
              for (const failure of failures.slice(0, 50)) {
                console.log(`\nPackage: ${failure.package}`);
                console.log(`Type: ${failure.type}`);
                console.log(failure.error);
                if (failure.consoleErrors?.length) console.log(`HTTP/CONSOLE: ${JSON.stringify(failure.consoleErrors)}`);
                if (failure.failedRequests?.length) console.log(`FAILED REQUESTS: ${JSON.stringify(failure.failedRequests)}`);
              }
            }
          }

          main().catch(error => {
            console.error("\nFATAL TEST ERROR");
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run compatibility tester
        run: node tester.cjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json progress.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update ARCH.js npm compatibility"
            git push
          fi
