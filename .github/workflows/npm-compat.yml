name: ARCH.js npm Compatibility Lab

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save playwright all-the-package-names
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = require("all-the-package-names");

          fs.writeFileSync(
            "packages.json",
            JSON.stringify(packages)
          );

          console.log(`Found ${packages.length} npm packages`);
          NODE

      - name: Select next 5000 packages
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const packages = JSON.parse(
            fs.readFileSync("packages.json", "utf8")
          );

          let offset = 0;

          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(
              fs.readFileSync("progress.json", "utf8")
            );

            offset = Number(progress.offset) || 0;
          }

          const batch = packages.slice(offset, offset + 5000);

          fs.writeFileSync(
            "batch.json",
            JSON.stringify(batch)
          );

          console.log(`Starting at package index: ${offset}`);
          console.log(`Batch size: ${batch.length}`);
          console.log(
            `Range: ${offset + 1}-${offset + batch.length}`
          );
          NODE

      - name: Create compatibility tester
        run: |
          cat > tester.cjs <<'NODE'
          const fs = require("fs");
          const http = require("http");
          const { chromium } = require("playwright");

          async function main() {
            const packages = JSON.parse(
              fs.readFileSync("batch.json", "utf8")
            );

            if (packages.length === 0) {
              console.log("No packages left to test.");
              return;
            }

            const CONCURRENCY = 8;
            const ARCH_BASE =
              "https://chibbit-99.github.io/arch.js/";

            let nextIndex = 0;
            const working = [];
            const errors = [];

            function encodePackage(name) {
              return Buffer
                .from(name, "utf8")
                .toString("base64url");
            }

            function decodePackage(value) {
              return Buffer
                .from(value, "base64url")
                .toString("utf8");
            }

            const server = http.createServer((req, res) => {
              try {
                const url = new URL(
                  req.url,
                  "http://127.0.0.1:4173"
                );

                if (!url.pathname.startsWith("/test/")) {
                  res.writeHead(404);
                  res.end("Not found");
                  return;
                }

                const encoded =
                  url.pathname.slice("/test/".length);

                const packageName =
                  decodePackage(encoded);

                const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <base href="${ARCH_BASE}">
            <script src="${ARCH_BASE}releases/latest.js"></script>
          </head>
          <body>
            <script type="module">
              window.__ARCH_RESULT__ = {
                done: false,
                working: false,
                packageName: ${JSON.stringify(packageName)},
                error: null
              };

              (async () => {
                try {
                  await importPackage(
                    ${JSON.stringify(packageName)}
                  );

                  window.__ARCH_RESULT__ = {
                    done: true,
                    working: true,
                    packageName: ${JSON.stringify(packageName)},
                    error: null
                  };
                } catch (error) {
                  window.__ARCH_RESULT__ = {
                    done: true,
                    working: false,
                    packageName: ${JSON.stringify(packageName)},
                    error: String(
                      error?.stack ||
                      error?.message ||
                      error
                    ).slice(0, 10000)
                  };
                }
              })();
            </script>
          </body>
          </html>`;

                res.writeHead(200, {
                  "Content-Type": "text/html"
                });

                res.end(html);
              } catch (error) {
                res.writeHead(500);
                res.end(String(error));
              }
            });

            await new Promise((resolve, reject) => {
              server.once("error", reject);

              server.listen(
                4173,
                "127.0.0.1",
                resolve
              );
            });

            console.log(
              "Local test server started."
            );

            const browser = await chromium.launch({
              headless: true
            });

            /*
             * Sanity check using the package that
             * previously passed.
             */

            const sanityPackage =
              "02-webpack-numbers-gx";

            console.log("");
            console.log(
              "========== SANITY CHECK =========="
            );
            console.log(
              sanityPackage
            );

            {
              const context =
                await browser.newContext();

              const page =
                await context.newPage();

              try {
                const encoded =
                  encodePackage(sanityPackage);

                await page.goto(
                  `http://127.0.0.1:4173/test/${encoded}`,
                  {
                    waitUntil: "domcontentloaded",
                    timeout: 30000
                  }
                );

                await page.waitForFunction(
                  () =>
                    window.__ARCH_RESULT__ &&
                    window.__ARCH_RESULT__.done === true,
                  {
                    timeout: 60000
                  }
                );

                const result =
                  await page.evaluate(
                    () => window.__ARCH_RESULT__
                  );

                console.log(
                  `Received package: ${result.packageName}`
                );

                if (
                  result.packageName !==
                  sanityPackage
                ) {
                  throw new Error(
                    `Package name mismatch: expected "${sanityPackage}", got "${result.packageName}"`
                  );
                }

                if (!result.working) {
                  console.error(
                    "Sanity check failed:"
                  );

                  console.error(
                    result.error
                  );

                  throw new Error(
                    "Known-good package failed."
                  );
                }

                console.log(
                  "SANITY CHECK PASSED"
                );
              } finally {
                await context.close();
              }
            }

            /*
             * Concurrent workers.
             */

            async function worker(workerId) {
              const context =
                await browser.newContext();

              try {
                while (true) {
                  const index = nextIndex++;

                  if (index >= packages.length) {
                    return;
                  }

                  const packageName =
                    packages[index];

                  const encoded =
                    encodePackage(packageName);

                  console.log(
                    `[Worker ${workerId}] ${index + 1}/${packages.length} ${packageName}`
                  );

                  let page = null;

                  try {
                    page =
                      await context.newPage();

                    await page.goto(
                      `http://127.0.0.1:4173/test/${encoded}`,
                      {
                        waitUntil:
                          "domcontentloaded",
                        timeout: 30000
                      }
                    );

                    await page.waitForFunction(
                      () =>
                        window.__ARCH_RESULT__ &&
                        window.__ARCH_RESULT__.done === true,
                      {
                        timeout: 60000
                      }
                    );

                    const result =
                      await page.evaluate(
                        () => window.__ARCH_RESULT__
                      );

                    if (
                      result.packageName !==
                      packageName
                    ) {
                      throw new Error(
                        `Package name mismatch: expected "${packageName}", got "${result.packageName}"`
                      );
                    }

                    if (result.working) {
                      working.push(packageName);

                      console.log(
                        `[Worker ${workerId}] WORKS ${packageName}`
                      );
                    } else {
                      console.log(
                        `[Worker ${workerId}] FAIL ${packageName}`
                      );

                      if (
                        result.error &&
                        errors.length < 10
                      ) {
                        errors.push({
                          package: packageName,
                          error: result.error
                        });
                      }
                    }
                  } catch (error) {
                    console.log(
                      `[Worker ${workerId}] ERROR ${packageName}`
                    );

                    if (errors.length < 10) {
                      errors.push({
                        package: packageName,
                        error: String(error)
                      });
                    }
                  } finally {
                    if (page) {
                      await page.close();
                    }
                  }
                }
              } finally {
                await context.close();
              }
            }

            await Promise.all(
              Array.from(
                {
                  length: Math.min(
                    CONCURRENCY,
                    packages.length
                  )
                },
                (_, index) =>
                  worker(index + 1)
              )
            );

            await browser.close();
            server.close();

            let previousOffset = 0;

            if (fs.existsSync("progress.json")) {
              const progress = JSON.parse(
                fs.readFileSync(
                  "progress.json",
                  "utf8"
                )
              );

              previousOffset =
                Number(progress.offset) || 0;
            }

            const newOffset =
              previousOffset + packages.length;

            const result = {
              packagetestedindex: newOffset,
              working,
              working_count: working.length
            };

            fs.writeFileSync(
              "results.json",
              JSON.stringify(
                result,
                null,
                2
              ) + "\n"
            );

            fs.writeFileSync(
              "progress.json",
              JSON.stringify(
                {
                  offset: newOffset
                },
                null,
                2
              ) + "\n"
            );

            console.log("");
            console.log(
              "================================"
            );
            console.log(
              "ARCH.js COMPATIBILITY RESULTS"
            );
            console.log(
              "================================"
            );
            console.log(
              `Tested:  ${packages.length}`
            );
            console.log(
              `Working: ${working.length}`
            );
            console.log(
              `Index:   ${newOffset}`
            );
            console.log(
              "================================"
            );

            if (errors.length > 0) {
              console.log("");
              console.log(
                "Failure samples:"
              );

              for (const error of errors) {
                console.log("");
                console.log(
                  `Package: ${error.package}`
                );
                console.log(
                  error.error
                );
              }
            }
          }

          main().catch(error => {
            console.error("");
            console.error(
              "FATAL TEST ERROR"
            );
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run compatibility tester
        run: |
          node tester.cjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.json progress.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update ARCH.js npm compatibility"
            git push
          fi
