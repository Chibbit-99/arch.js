name: ARCH.js npm Compatibility Lab

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save playwright all-the-package-names
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          node <<'EOF'
          const fs = require("fs");

          const packages =
            require("all-the-package-names");

          fs.writeFileSync(
            "packages.json",
            JSON.stringify(packages)
          );

          console.log(
            `Found ${packages.length} npm packages`
          );
          EOF

      - name: Select next 5000 packages
        run: |
          node <<'EOF'
          const fs = require("fs");

          const packages = JSON.parse(
            fs.readFileSync(
              "packages.json",
              "utf8"
            )
          );

          let offset = 0;

          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(
              fs.readFileSync(
                "progress.json",
                "utf8"
              )
            );

            offset = progress.offset || 0;
          }

          const batch = packages.slice(
            offset,
            offset + 5000
          );

          fs.writeFileSync(
            "batch.json",
            JSON.stringify(batch)
          );

          console.log(
            `Starting at package index ${offset}`
          );

          console.log(
            `Batch size: ${batch.length}`
          );

          console.log(
            `Range: ${offset + 1}-${offset + batch.length}`
          );
          EOF

      - name: Test ARCH.js
        run: |
          node <<'EOF'
          (async () => {
            const fs = require("fs");
            const http = require("http");
            const { chromium } = require("playwright");

            const packages = JSON.parse(
              fs.readFileSync(
                "batch.json",
                "utf8"
              )
            );

            if (packages.length === 0) {
              console.log(
                "No packages left."
              );
              return;
            }

            const CONCURRENCY = 8;

            let nextIndex = 0;
            const working = [];

            const server =
              http.createServer(
                (req, res) => {
                  try {
                    const url = new URL(
                      req.url,
                      "http://127.0.0.1:4173"
                    );

                    const packageName =
                      url.searchParams.get(
                        "package"
                      );

                    if (!packageName) {
                      res.writeHead(400);
                      res.end(
                        "Missing package"
                      );
                      return;
                    }

                    const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">

            <script
              src="https://chibbit-99.github.io/arch.js/releases/latest.js"
            ></script>
          </head>

          <body>

          <script type="module">

            window.__ARCH_RESULT__ = {
              done: false,
              working: false,
              error: null
            };

            (async () => {

              try {

                await importPackage(
                  ${JSON.stringify(packageName)}
                );

                window.__ARCH_RESULT__ = {
                  done: true,
                  working: true,
                  error: null
                };

              } catch (error) {

                window.__ARCH_RESULT__ = {
                  done: true,
                  working: false,
                  error: String(
                    error?.stack ||
                    error?.message ||
                    error
                  ).slice(0, 10000)
                };

              }

            })();

          </script>

          </body>
          </html>`;

                    res.writeHead(
                      200,
                      {
                        "Content-Type":
                          "text/html"
                      }
                    );

                    res.end(html);

                  } catch (error) {

                    res.writeHead(500);

                    res.end(
                      String(error)
                    );
                  }
                }
              );

            await new Promise(
              (resolve, reject) => {

                server.once(
                  "error",
                  reject
                );

                server.listen(
                  4173,
                  "127.0.0.1",
                  resolve
                );
              }
            );

            console.log(
              "Local test server started."
            );

            const browser =
              await chromium.launch({
                headless: true
              });

            /*
             * --------------------------------------------------
             * Known-good sanity check
             * --------------------------------------------------
             *
             * This package worked in the earlier single-worker
             * version. If it fails here, the problem is the
             * browser/test harness, not the package batch.
             */

            console.log("");
            console.log(
              "=== SANITY CHECK ==="
            );
            console.log(
              "Testing 02-webpack-numbers-gx"
            );

            {
              const context =
                await browser.newContext();

              const page =
                await context.newPage();

              try {

                await page.goto(
                  "http://127.0.0.1:4173/?package=02-webpack-numbers-gx",
                  {
                    waitUntil:
                      "domcontentloaded",
                    timeout: 30000
                  }
                );

                await page.waitForFunction(
                  () =>
                    window.__ARCH_RESULT__ &&
                    window.__ARCH_RESULT__.done === true,
                  {
                    timeout: 60000
                  }
                );

                const sanity =
                  await page.evaluate(
                    () =>
                      window.__ARCH_RESULT__
                  );

                console.log(
                  `Sanity status: ${
                    sanity.working
                      ? "PASS"
                      : "FAIL"
                  }`
                );

                if (!sanity.working) {
                  console.log(
                    "Sanity error:"
                  );

                  console.log(
                    sanity.error
                  );

                  await browser.close();
                  server.close();

                  throw new Error(
                    "Known-good package failed. Stopping before running the batch."
                  );
                }

              } finally {
                await context.close();
              }
            }

            console.log(
              "=== SANITY CHECK PASSED ==="
            );
            console.log("");

            /*
             * --------------------------------------------------
             * Concurrent workers
             * --------------------------------------------------
             */

            const errorSamples = [];
            const MAX_ERROR_SAMPLES = 20;

            async function worker(workerId) {

              /*
               * Every worker has its own browser context.
               * This isolates cookies, storage, service workers,
               * caches and other browser state.
               */

              const context =
                await browser.newContext();

              try {

                while (true) {

                  const index =
                    nextIndex++;

                  if (
                    index >=
                    packages.length
                  ) {
                    return;
                  }

                  const packageName =
                    packages[index];

                  console.log(
                    `[Worker ${workerId}] ${index + 1}/${packages.length} ${packageName}`
                  );

                  let page = null;

                  try {

                    page =
                      await context.newPage();

                    await page.goto(
                      `http://127.0.0.1:4173/?package=${encodeURIComponent(packageName)}`,
                      {
                        waitUntil:
                          "domcontentloaded",
                        timeout: 30000
                      }
                    );

                    await page.waitForFunction(
                      () =>
                        window.__ARCH_RESULT__ &&
                        window.__ARCH_RESULT__.done === true,
                      {
                        timeout: 60000
                      }
                    );

                    const result =
                      await page.evaluate(
                        () =>
                          window.__ARCH_RESULT__
                      );

                    if (
                      result.working
                    ) {

                      working.push(
                        packageName
                      );

                      console.log(
                        `[Worker ${workerId}] WORKS ${packageName}`
                      );

                    } else {

                      console.log(
                        `[Worker ${workerId}] FAIL ${packageName}`
                      );

                      if (
                        result.error &&
                        errorSamples.length <
                          MAX_ERROR_SAMPLES
                      ) {

                        errorSamples.push({
                          package:
                            packageName,

                          error:
                            result.error
                        });
                      }
                    }

                  } catch (error) {

                    console.log(
                      `[Worker ${workerId}] ERROR ${packageName}`
                    );

                    if (
                      errorSamples.length <
                        MAX_ERROR_SAMPLES
                    ) {

                      errorSamples.push({
                        package:
                          packageName,

                        error:
                          String(error)
                      });
                    }

                  } finally {

                    if (page) {
                      await page.close();
                    }
                  }
                }

              } finally {

                await context.close();
              }
            }

            await Promise.all(
              Array.from(
                {
                  length:
                    Math.min(
                      CONCURRENCY,
                      packages.length
                    )
                },
                (_, index) =>
                  worker(index + 1)
              )
            );

            await browser.close();

            server.close();

            /*
             * --------------------------------------------------
             * Save results
             * --------------------------------------------------
             */

            const previousOffset =
              fs.existsSync(
                "progress.json"
              )
                ? (
                    JSON.parse(
                      fs.readFileSync(
                        "progress.json",
                        "utf8"
                      )
                    ).offset || 0
                  )
                : 0;

            const newOffset =
              previousOffset +
              packages.length;

            const result = {
              packagetestedindex:
                newOffset,

              working,

              working_count:
                working.length
            };

            fs.writeFileSync(
              "results.json",
              JSON.stringify(
                result,
                null,
                2
              ) + "\n"
            );

            fs.writeFileSync(
              "progress.json",
              JSON.stringify(
                {
                  offset:
                    newOffset
                },
                null,
                2
              ) + "\n"
            );

            /*
             * --------------------------------------------------
             * Summary
             * --------------------------------------------------
             */

            console.log("");
            console.log(
              "================================"
            );

            console.log(
              "ARCH.js COMPATIBILITY RESULTS"
            );

            console.log(
              "================================"
            );

            console.log(
              `Tested:  ${packages.length}`
            );

            console.log(
              `Working: ${working.length}`
            );

            console.log(
              `Index:   ${newOffset}`
            );

            console.log(
              "================================"
            );

            /*
             * Only print samples to the Actions log.
             * They are NOT written to results.json.
             */

            if (
              errorSamples.length > 0
            ) {

              console.log("");
              console.log(
                "First failure samples:"
              );

              for (
                const sample of
                errorSamples
              ) {

                console.log("");
                console.log(
                  `Package: ${sample.package}`
                );

                console.log(
                  sample.error
                );
              }
            }

          })().catch(error => {

            console.error("");
            console.error(
              "FATAL TEST ERROR"
            );
            console.error(
              error
            );

            process.exit(1);
          });
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.json progress.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit \
              -m "chore: update ARCH.js npm compatibility"

            git push
          fi
