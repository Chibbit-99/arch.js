name: ARCH.js npm Compatibility Lab

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save playwright all-the-package-names
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = require("all-the-package-names");
          fs.writeFileSync("packages.json", JSON.stringify(packages));
          console.log(`Found ${packages.length} npm packages`);
          NODE

      - name: Select next 5000 packages
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = JSON.parse(fs.readFileSync("packages.json", "utf8"));
          let offset = 0;
          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(fs.readFileSync("progress.json", "utf8"));
            offset = Number(progress.offset) || 0;
          }
          const batch = packages.slice(offset, offset + 5000);
          fs.writeFileSync("batch.json", JSON.stringify(batch));
          console.log(`Starting at package index: ${offset}`);
          console.log(`Batch size: ${batch.length}`);
          console.log(`Range: ${offset + 1}-${offset + batch.length}`);
          NODE

      - name: Create compatibility tester
        run: |
          cat > tester.cjs <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const http = require("http");
          const { chromium } = require("playwright");

          const CONCURRENCY = 6;
          const SANITY_PACKAGE = "02-webpack-numbers-gx";
          const PACKAGE_TIMEOUT = 60000;
          const PAGE_TIMEOUT = 30000;
          const PACKAGES_PER_BROWSER = 50;
          const HEARTBEAT_INTERVAL = 30000;

          const RELEASE_FILE = path.resolve("releases/latest.js");
          const MODULE_DIR = path.resolve("module");

          if (!fs.existsSync(RELEASE_FILE)) throw new Error(`Missing ${RELEASE_FILE}`);
          if (!fs.existsSync(MODULE_DIR)) throw new Error(`Missing ${MODULE_DIR}`);

          const moduleNames = fs.readdirSync(MODULE_DIR)
            .filter(name => name.endsWith(".js"))
            .sort();

          if (!moduleNames.length) throw new Error("No ARCH modules found in ./module");

          const moduleFiles = new Map(
            moduleNames.map(name => [name, fs.readFileSync(path.join(MODULE_DIR, name), "utf8")])
          );
          const latestRelease = fs.readFileSync(RELEASE_FILE, "utf8");

          const projectConfig = JSON.stringify({ modules: moduleNames, js: [] });
          const projectInit = "// Normal ARCH project init.js; intentionally empty for compatibility testing.\n";

          console.log(`ARCH local project ready | release=${latestRelease.length}B modules=${moduleNames.length}`);

          function encodePackage(name) {
            return Buffer.from(name, "utf8").toString("base64url");
          }

          function decodePackage(value) {
            return Buffer.from(value, "base64url").toString("utf8");
          }

          function classifyFailure(result) {
            const error = String(result.error || "");
            const allText = [error, ...(result.consoleErrors || []), ...(result.pageErrors || []), ...(result.failedRequests || [])].join("\n");
            if (/Could not discover ARCH modules/i.test(error)) return "environment";
            if (/Cannot resolve package entry/i.test(error)) return "unresolvable";
            if (/Could not resolve .*@latest|No published version .* satisfies|has no package\.json/i.test(error)) return "unresolvable";
            if (/Node builtin|Node-only code|Module not found/i.test(error)) return "incompatible";
            if (/Failed to fetch|NetworkError|net::|ECONNRESET|ERR_CONNECTION/i.test(allText)) return "network";
            if (/\b404\b/i.test(allText)) return "resource_error";
            if (/\b(408|429|500|502|503|504)\b/i.test(allText)) return "network";
            if (/Timeout \d+ms exceeded/i.test(allText)) return "timeout";
            return "incompatible";
          }

          function makeResult(packageName, error, extra = {}) {
            return {
              done: true,
              working: false,
              packageName,
              error: String(error?.stack || error?.message || error || "unknown error").slice(0, 10000),
              consoleErrors: [],
              pageErrors: [],
              failedRequests: [],
              ...extra
            };
          }

          async function testPackage(browser, packageName) {
            let context = null;
            try {
              context = await browser.newContext();
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const failedRequests = [];

              page.on("pageerror", error => pageErrors.push(String(error?.stack || error)));
              page.on("console", message => {
                if (message.type() === "error") consoleErrors.push(message.text());
              });
              page.on("response", response => {
                if (response.status() >= 400) consoleErrors.push(`${response.status()} ${response.url()}`);
              });
              page.on("requestfailed", request => {
                failedRequests.push(`${request.url()}: ${request.failure()?.errorText || "unknown error"}`);
              });

              await page.goto(
                `http://127.0.0.1:4173/test?package=${encodeURIComponent(encodePackage(packageName))}`,
                { waitUntil: "domcontentloaded", timeout: PAGE_TIMEOUT }
              );

              await page.waitForFunction(
                () => window.__ARCH_RESULT__?.done === true,
                { timeout: PACKAGE_TIMEOUT }
              );

              return await page.evaluate(
                ({ consoleErrors, pageErrors, failedRequests }) => ({
                  ...window.__ARCH_RESULT__, consoleErrors, pageErrors, failedRequests
                }),
                { consoleErrors, pageErrors, failedRequests }
              );
            } catch (error) {
              return makeResult(packageName, error, { consoleErrors: [], pageErrors: [], failedRequests: [] });
            } finally {
              if (context) await context.close().catch(() => {});
            }
          }

          async function launchBrowser() {
            return chromium.launch({ headless: true, args: ["--disable-dev-shm-usage"] });
          }

          async function runSanityCheck(browser, label) {
            const result = await testPackage(browser, SANITY_PACKAGE);
            const passed = result.packageName === SANITY_PACKAGE && result.working === true;
            console.log(`[SANITY] ${label} ${passed ? "PASS" : "FAIL"}`);
            if (!passed) console.log(`[SANITY] ${label} error=${String(result.error || "unknown").replace(/\s+/g, " ").slice(0, 300)}`);
            return { passed, result };
          }

          async function createVerifiedBrowser(workerId) {
            const browser = await launchBrowser();
            const sanity = await runSanityCheck(browser, `W${workerId}`);
            if (!sanity.passed) {
              await browser.close().catch(() => {});
              throw new Error("ARCH.js test environment failed the known-good package in a fresh browser.");
            }
            return browser;
          }

          async function main() {
            const packages = JSON.parse(fs.readFileSync("batch.json", "utf8"));
            if (!packages.length) return console.log("No packages left to test.");

            const working = [];
            const failures = [];
            const resultsByIndex = new Map();
            const workerState = new Map();
            let nextIndex = 0;
            const startedAt = Date.now();

            const heartbeat = setInterval(() => {
              const done = resultsByIndex.size;
              const states = Array.from(workerState.entries()).map(([id, state]) => `W${id}:${state}`).join(" ");
              console.log(`[STATUS] ${done}/${packages.length} | ${states || "starting"} | ${Math.floor((Date.now() - startedAt) / 60000)}m`);
            }, HEARTBEAT_INTERVAL);

            const server = http.createServer((req, res) => {
              try {
                const url = new URL(req.url, "http://127.0.0.1:4173");

                if (url.pathname === "/arch/config.json") {
                  res.writeHead(200, { "Content-Type": "application/json; charset=utf-8" });
                  return res.end(projectConfig);
                }

                if (url.pathname === "/arch/init.js") {
                  res.writeHead(200, { "Content-Type": "application/javascript; charset=utf-8" });
                  return res.end(projectInit);
                }

                if (url.pathname === "/releases/latest.js") {
                  res.writeHead(200, { "Content-Type": "application/javascript; charset=utf-8" });
                  return res.end(latestRelease);
                }

                if (url.pathname.startsWith("/module/")) {
                  const name = decodeURIComponent(url.pathname.slice("/module/".length));
                  const source = moduleFiles.get(name);
                  if (source === undefined) {
                    res.writeHead(404);
                    return res.end("Module not found");
                  }
                  res.writeHead(200, { "Content-Type": "application/javascript; charset=utf-8" });
                  return res.end(source);
                }

                if (url.pathname === "/test") {
                  const encoded = url.searchParams.get("package");
                  if (!encoded) {
                    res.writeHead(400);
                    return res.end("Missing package");
                  }

                  const packageName = decodePackage(encoded);
                  const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <script src="/releases/latest.js"></script>
          </head>
          <body>
            <script type="module">
              const packageName = ${JSON.stringify(packageName)};
              window.__ARCH_RESULT__ = { done: false, working: false, packageName, error: null };
              (async () => {
                try {
                  await importPackage(packageName);
                  window.__ARCH_RESULT__ = { done: true, working: true, packageName, error: null };
                } catch (error) {
                  window.__ARCH_RESULT__ = { done: true, working: false, packageName, error: String(error?.stack || error?.message || error).slice(0, 10000) };
                }
              })();
            </script>
          </body>
          </html>`;

                  res.writeHead(200, { "Content-Type": "text/html; charset=utf-8" });
                  return res.end(html);
                }

                res.writeHead(404);
                res.end("Not found");
              } catch (error) {
                res.writeHead(500);
                res.end(String(error));
              }
            });

            await new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(4173, "127.0.0.1", resolve);
            });

            console.log(`ARCH tester | ${packages.length} packages | ${CONCURRENCY} workers | browser reset=${PACKAGES_PER_BROWSER}`);

            async function worker(workerId) {
              let browser = null;
              let sinceRestart = 0;
              try {
                browser = await createVerifiedBrowser(workerId);
                workerState.set(workerId, "idle");

                while (true) {
                  if (sinceRestart >= PACKAGES_PER_BROWSER) {
                    workerState.set(workerId, "restart");
                    await browser.close().catch(() => {});
                    browser = await createVerifiedBrowser(workerId);
                    sinceRestart = 0;
                    workerState.set(workerId, "idle");
                  }

                  const index = nextIndex++;
                  if (index >= packages.length) return;

                  const packageName = packages[index];
                  workerState.set(workerId, packageName);
                  const result = await testPackage(browser, packageName);
                  resultsByIndex.set(index, result);
                  sinceRestart++;

                  if (result.working) {
                    working.push(packageName);
                    console.log(`[W${workerId}] ${index + 1}/${packages.length} ${packageName} [WORKS]`);
                    continue;
                  }

                  const type = classifyFailure(result);
                  if (type === "environment") {
                    throw new Error(`ARCH environment failure while testing ${packageName}: ${result.error}`);
                  }

                  failures.push({
                    package: packageName,
                    type,
                    error: result.error || "unknown error",
                    consoleErrors: result.consoleErrors || [],
                    pageErrors: result.pageErrors || [],
                    failedRequests: result.failedRequests || []
                  });
                  console.log(`[W${workerId}] ${index + 1}/${packages.length} ${packageName} [${type}]`);
                }
              } finally {
                workerState.set(workerId, "done");
                if (browser) await browser.close().catch(() => {});
              }
            }

            try {
              await Promise.all(
                Array.from({ length: Math.min(CONCURRENCY, packages.length) }, (_, i) => worker(i + 1))
              );
            } finally {
              clearInterval(heartbeat);
              server.close();
            }

            let previousOffset = 0;
            if (fs.existsSync("progress.json")) {
              previousOffset = Number(JSON.parse(fs.readFileSync("progress.json", "utf8")).offset) || 0;
            }

            const newOffset = previousOffset + packages.length;
            const counts = {
              incompatible: failures.filter(x => x.type === "incompatible").length,
              unresolvable: failures.filter(x => x.type === "unresolvable").length,
              network: failures.filter(x => x.type === "network").length,
              resource_error: failures.filter(x => x.type === "resource_error").length,
              timeout: failures.filter(x => x.type === "timeout").length
            };

            const orderedResults = Array.from(resultsByIndex.entries())
              .sort(([a], [b]) => a - b)
              .map(([, result]) => result);

            fs.writeFileSync("results.json", JSON.stringify({
              version: 5,
              packagetestedindex: newOffset,
              tested_count: orderedResults.length,
              working,
              working_count: working.length,
              failed: failures.map(x => x.package),
              failed_count: failures.length,
              failure_counts: counts,
              errors: failures
            }, null, 2) + "\n");

            fs.writeFileSync("progress.json", JSON.stringify({ offset: newOffset }, null, 2) + "\n");

            console.log(`[DONE] tested=${packages.length} works=${working.length} failed=${failures.length} incompatible=${counts.incompatible} unresolvable=${counts.unresolvable} network=${counts.network} resource=${counts.resource_error} timeout=${counts.timeout} index=${newOffset}`);
          }

          main().catch(error => {
            console.error(`[FATAL] ${String(error?.stack || error).replace(/\s+/g, " ")}`);
            process.exit(1);
          });
          NODE

      - name: Run compatibility tester
        run: node tester.cjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json progress.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update ARCH.js npm compatibility"
            git push
          fi
