name: ARCH.js npm Compatibility Lab

"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save playwright all-the-package-names
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = require("all-the-package-names");
          fs.writeFileSync("packages.json", JSON.stringify(packages));
          console.log(`Found ${packages.length} npm packages`);
          NODE

      - name: Select next 5000 packages
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packages = JSON.parse(fs.readFileSync("packages.json", "utf8"));
          let offset = 0;

          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(fs.readFileSync("progress.json", "utf8"));
            offset = Number(progress.offset) || 0;
          }

          const batch = packages.slice(offset, offset + 5000);
          fs.writeFileSync("batch.json", JSON.stringify(batch));

          console.log(`Starting at package index: ${offset}`);
          console.log(`Batch size: ${batch.length}`);
          console.log(`Range: ${offset + 1}-${offset + batch.length}`);
          NODE

      - name: Create compatibility tester
        run: |
          cat > tester.cjs <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const http = require("http");
          const { chromium } = require("playwright");

          const CONCURRENCY = 2;
          const SANITY_PACKAGE = "02-webpack-numbers-gx";
          const PACKAGE_TIMEOUT = 60000;
          const PAGE_TIMEOUT = 30000;
          const PACKAGES_PER_BROWSER = 50;

          const ARCH_RELEASE = path.resolve("releases/latest.js");
          const ARCH_MODULE_DIR = path.resolve("module");

          if (!fs.existsSync(ARCH_RELEASE)) {
            throw new Error(`Missing local ARCH release: ${ARCH_RELEASE}`);
          }

          if (!fs.existsSync(ARCH_MODULE_DIR)) {
            throw new Error(`Missing local ARCH module directory: ${ARCH_MODULE_DIR}`);
          }

          const moduleNames = fs.readdirSync(ARCH_MODULE_DIR)
            .filter(name => name.endsWith(".js"))
            .sort();

          if (!moduleNames.length) {
            throw new Error("No ARCH modules found in ./module");
          }

          const moduleFiles = new Map(
            moduleNames.map(name => [
              name,
              fs.readFileSync(path.join(ARCH_MODULE_DIR, name), "utf8")
            ])
          );

          const latestRelease = fs.readFileSync(ARCH_RELEASE, "utf8");

          console.log(`Loaded local ARCH release: ${latestRelease.length} bytes`);
          console.log(`Loaded ${moduleNames.length} local ARCH modules`);

          function encodePackage(name) {
            return Buffer.from(name, "utf8").toString("base64url");
          }

          function decodePackage(value) {
            return Buffer.from(value, "base64url").toString("utf8");
          }

          function classifyFailure(result) {
            const error = String(result.error || "");
            const allText = [
              error,
              ...(result.consoleErrors || []),
              ...(result.pageErrors || []),
              ...(result.failedRequests || [])
            ].join("\n");

            if (/Could not discover ARCH modules|Failed to fetch|Cannot resolve package entry/i.test(error)) {
              if (/Could not discover ARCH modules/i.test(error)) return "environment";
              return "unresolvable";
            }

            if (/Node builtin|Node-only code|Could not resolve|Module not found/i.test(error)) {
              return "incompatible";
            }

            if (/Failed to fetch|NetworkError|net::|ECONNRESET|ERR_CONNECTION/i.test(allText)) {
              return "network";
            }

            if (/\b404\b/i.test(allText)) return "resource_error";
            if (/\b(408|429|500|502|503|504)\b/i.test(allText)) return "network";

            return "incompatible";
          }

          function makeTestResult(packageName, error, extra = {}) {
            return {
              done: true,
              working: false,
              packageName,
              error: String(error?.stack || error?.message || error || "unknown error").slice(0, 10000),
              consoleErrors: [],
              pageErrors: [],
              failedRequests: [],
              ...extra
            };
          }

          async function testPackage(browser, packageName) {
            const context = await browser.newContext();
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];

            page.on("pageerror", error => {
              pageErrors.push(String(error?.stack || error));
            });

            page.on("console", message => {
              if (message.type() === "error") {
                consoleErrors.push(message.text());
              }
            });

            page.on("response", response => {
              if (response.status() >= 400) {
                consoleErrors.push(`${response.status()} ${response.url()}`);
              }
            });

            page.on("requestfailed", request => {
              failedRequests.push(
                `${request.url()}: ${request.failure()?.errorText || "unknown error"}`
              );
            });

            try {
              await page.route("**/*", async route => {
                const url = route.request().url();

                // Use the exact checked-out release instead of the live GitHub Pages copy.
                if (url === "https://chibbit-99.github.io/arch.js/releases/latest.js") {
                  await route.fulfill({
                    status: 200,
                    contentType: "application/javascript; charset=utf-8",
                    body: latestRelease
                  });
                  return;
                }

                // Keep ARCH module discovery completely out of the GitHub API.
                if (url === "https://api.github.com/repos/Chibbit-99/arch.js/contents/module?ref=main") {
                  await route.fulfill({
                    status: 200,
                    contentType: "application/json; charset=utf-8",
                    body: JSON.stringify(
                      moduleNames.map(name => ({
                        name,
                        type: "file"
                      }))
                    )
                  });
                  return;
                }

                // Serve the checked-out module source instead of GitHub Pages.
                const modulePrefix = "https://chibbit-99.github.io/arch.js/module/";
                if (url.startsWith(modulePrefix)) {
                  const moduleName = decodeURIComponent(url.slice(modulePrefix.length));
                  const source = moduleFiles.get(moduleName);

                  if (source !== undefined) {
                    await route.fulfill({
                      status: 200,
                      contentType: "application/javascript; charset=utf-8",
                      body: source
                    });
                    return;
                  }
                }

                await route.continue();
              });

              const encoded = encodePackage(packageName);

              await page.goto(
                `http://127.0.0.1:4173/test/${encoded}`,
                { waitUntil: "domcontentloaded", timeout: PAGE_TIMEOUT }
              );

              await page.waitForFunction(
                () => window.__ARCH_RESULT__ && window.__ARCH_RESULT__.done === true,
                { timeout: PACKAGE_TIMEOUT }
              );

              return await page.evaluate(
                ({ consoleErrors, pageErrors, failedRequests }) => ({
                  ...window.__ARCH_RESULT__,
                  consoleErrors,
                  pageErrors,
                  failedRequests
                }),
                { consoleErrors, pageErrors, failedRequests }
              );
            } catch (error) {
              return makeTestResult(packageName, error, {
                consoleErrors,
                pageErrors,
                failedRequests
              });
            } finally {
              await context.close().catch(() => {});
            }
          }

          async function launchBrowser() {
            return chromium.launch({
              headless: true,
              args: ["--disable-dev-shm-usage"]
            });
          }

          async function runSanityCheck(browser, label) {
            const result = await testPackage(browser, SANITY_PACKAGE);
            const passed = result.packageName === SANITY_PACKAGE && result.working === true;

            if (passed) {
              console.log(`[SANITY] ${label}: PASS`);
            } else {
              console.error(`[SANITY] ${label}: FAIL`);
              console.error(JSON.stringify(result, null, 2));
            }

            return { passed, result };
          }

          async function createVerifiedBrowser(workerId) {
            const browser = await launchBrowser();
            const sanity = await runSanityCheck(browser, `worker ${workerId}, initial browser`);

            if (!sanity.passed) {
              await browser.close().catch(() => {});
              throw new Error(
                "ARCH.js test environment failed the known-good package in a fresh browser. " +
                "The failure is shown above and package testing has been stopped."
              );
            }

            return browser;
          }

          async function main() {
            const packages = JSON.parse(fs.readFileSync("batch.json", "utf8"));

            if (packages.length === 0) {
              console.log("No packages left to test.");
              return;
            }

            const working = [];
            const failures = [];
            const resultsByIndex = new Map();
            let nextIndex = 0;

            const server = http.createServer((req, res) => {
              try {
                const url = new URL(req.url, "http://127.0.0.1:4173");

                if (url.pathname === "/releases/latest.js") {
                  res.writeHead(200, { "Content-Type": "application/javascript; charset=utf-8" });
                  res.end(latestRelease);
                  return;
                }

                if (!url.pathname.startsWith("/test/")) {
                  res.writeHead(404);
                  res.end("Not found");
                  return;
                }

                const packageName = decodePackage(url.pathname.slice("/test/".length));

                const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <script src="/releases/latest.js"></script>
          </head>
          <body>
            <script type="module">
              window.__ARCH_RESULT__ = {
                done: false,
                working: false,
                packageName: ${JSON.stringify(packageName)},
                error: null
              };

              (async () => {
                try {
                  await importPackage(${JSON.stringify(packageName)});
                  window.__ARCH_RESULT__ = {
                    done: true,
                    working: true,
                    packageName: ${JSON.stringify(packageName)},
                    error: null
                  };
                } catch (error) {
                  window.__ARCH_RESULT__ = {
                    done: true,
                    working: false,
                    packageName: ${JSON.stringify(packageName)},
                    error: String(error?.stack || error?.message || error).slice(0, 10000)
                  };
                }
              })();
            </script>
          </body>
          </html>`;

                res.writeHead(200, { "Content-Type": "text/html; charset=utf-8" });
                res.end(html);
              } catch (error) {
                res.writeHead(500);
                res.end(String(error));
              }
            });

            await new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(4173, "127.0.0.1", resolve);
            });

            console.log("Local test server started.");
            console.log(`Testing ${packages.length} packages with ${CONCURRENCY} workers.`);
            console.log("ARCH release and modules are served from the checked-out repository.");
            console.log("GitHub API module discovery is intercepted and never used by the browser.");
            console.log(`Browser restart interval: ${PACKAGES_PER_BROWSER} packages.`);

            async function worker(workerId) {
              let browser = null;
              let sinceRestart = 0;

              try {
                browser = await createVerifiedBrowser(workerId);

                while (true) {
                  if (sinceRestart >= PACKAGES_PER_BROWSER) {
                    console.log(`[Worker ${workerId}] Restarting browser after ${sinceRestart} packages.`);
                    await browser.close().catch(() => {});
                    browser = await createVerifiedBrowser(workerId);
                    sinceRestart = 0;
                  }

                  const index = nextIndex++;
                  if (index >= packages.length) return;

                  const packageName = packages[index];
                  console.log(`\n[Worker ${workerId}] ${index + 1}/${packages.length} ${packageName}`);

                  const result = await testPackage(browser, packageName);
                  resultsByIndex.set(index, result);
                  sinceRestart++;

                  if (result.working) {
                    working.push(packageName);
                    console.log(`[Worker ${workerId}] WORKS ${packageName}`);
                  } else {
                    const failureType = classifyFailure(result);

                    if (failureType === "environment") {
                      throw new Error(
                        `ARCH environment failure while testing ${packageName}: ${result.error}`
                      );
                    }

                    const failure = {
                      package: packageName,
                      type: failureType,
                      error: result.error || "unknown error",
                      consoleErrors: result.consoleErrors || [],
                      pageErrors: result.pageErrors || [],
                      failedRequests: result.failedRequests || []
                    };

                    failures.push(failure);

                    console.log(`[Worker ${workerId}] FAIL ${packageName} [${failureType}]`);
                    console.log(`[Worker ${workerId}] ERROR ${packageName}: ${failure.error}`);

                    if (failure.consoleErrors.length) {
                      console.log(`[Worker ${workerId}] HTTP/CONSOLE: ${JSON.stringify(failure.consoleErrors)}`);
                    }
                    if (failure.pageErrors.length) {
                      console.log(`[Worker ${workerId}] PAGE ERRORS: ${JSON.stringify(failure.pageErrors)}`);
                    }
                    if (failure.failedRequests.length) {
                      console.log(`[Worker ${workerId}] FAILED REQUESTS: ${JSON.stringify(failure.failedRequests)}`);
                    }
                  }
                }
              } finally {
                if (browser) {
                  await browser.close().catch(() => {});
                }
              }
            }

            try {
              await Promise.all(
                Array.from(
                  { length: Math.min(CONCURRENCY, packages.length) },
                  (_, index) => worker(index + 1)
                )
              );
            } finally {
              server.close();
            }

            let previousOffset = 0;
            if (fs.existsSync("progress.json")) {
              const progress = JSON.parse(fs.readFileSync("progress.json", "utf8"));
              previousOffset = Number(progress.offset) || 0;
            }

            const newOffset = previousOffset + packages.length;
            const counts = {
              incompatible: failures.filter(x => x.type === "incompatible").length,
              unresolvable: failures.filter(x => x.type === "unresolvable").length,
              network: failures.filter(x => x.type === "network").length,
              resource_error: failures.filter(x => x.type === "resource_error").length
            };

            const orderedResults = Array.from(resultsByIndex.entries())
              .sort(([a], [b]) => a - b)
              .map(([, result]) => result);

            fs.writeFileSync(
              "results.json",
              JSON.stringify({
                version: 3,
                packagetestedindex: newOffset,
                tested_count: orderedResults.length,
                working,
                working_count: working.length,
                failed: failures.map(x => x.package),
                failed_count: failures.length,
                failure_counts: counts,
                errors: failures
              }, null, 2) + "\n"
            );

            fs.writeFileSync(
              "progress.json",
              JSON.stringify({ offset: newOffset }, null, 2) + "\n"
            );

            console.log("\n================================");
            console.log("ARCH.js COMPATIBILITY RESULTS");
            console.log("================================");
            console.log(`Tested:        ${packages.length}`);
            console.log(`Working:       ${working.length}`);
            console.log(`Failed:        ${failures.length}`);
            console.log(`Incompatible:  ${counts.incompatible}`);
            console.log(`Unresolvable:  ${counts.unresolvable}`);
            console.log(`Network:       ${counts.network}`);
            console.log(`Resource:      ${counts.resource_error}`);
            console.log(`Index:         ${newOffset}`);
            console.log("================================");

            if (failures.length) {
              console.log("\nFailure samples:");
              for (const failure of failures.slice(0, 50)) {
                console.log(`\nPackage: ${failure.package}`);
                console.log(`Type: ${failure.type}`);
                console.log(failure.error);
                if (failure.consoleErrors?.length) console.log(`HTTP/CONSOLE: ${JSON.stringify(failure.consoleErrors)}`);
                if (failure.failedRequests?.length) console.log(`FAILED REQUESTS: ${JSON.stringify(failure.failedRequests)}`);
              }
            }
          }

          main().catch(error => {
            console.error("\nFATAL TEST ERROR");
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run compatibility tester
        run: node tester.cjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json progress.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update ARCH.js npm compatibility"
            git push
          fi
