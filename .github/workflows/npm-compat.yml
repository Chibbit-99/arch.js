name: ARCH.js npm Compatibility Lab

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Get npm package list
        run: |
          npm pack all-the-package-names --silent

          TARBALL=$(ls all-the-package-names-*.tgz)

          mkdir package-data

          tar -xzf "$TARBALL" \
            -C package-data \
            --strip-components=1

          echo "Package contents:"
          find package-data -maxdepth 2 -type f

          if [ ! -f package-data/package-names.json ]; then
            echo "ERROR: package-names.json was not found"
            exit 1
          fi

          cp package-data/package-names.json packages.json

          rm -rf package-data "$TARBALL"

          node <<'EOF'
          const fs = require("fs");

          const packages = JSON.parse(
            fs.readFileSync("packages.json", "utf8")
          );

          console.log(`Found ${packages.length} npm packages`);
          EOF

      - name: Select next 1000 packages
        run: |
          node <<'EOF'
          const fs = require("fs");

          const packages = JSON.parse(
            fs.readFileSync("packages.json", "utf8")
          );

          let offset = 0;

          if (fs.existsSync("progress.json")) {
            const progress = JSON.parse(
              fs.readFileSync("progress.json", "utf8")
            );

            offset = progress.offset || 0;
          }

          const batch = packages.slice(
            offset,
            offset + 1000
          );

          if (batch.length === 0) {
            console.log("No packages left to test.");
            process.exit(0);
          }

          fs.writeFileSync(
            "batch.json",
            JSON.stringify(batch, null, 2)
          );

          console.log(
            `Testing packages ${offset + 1}-${offset + batch.length} of ${packages.length}`
          );
          EOF

      - name: Run ARCH.js compatibility tests
        run: |
          node <<'EOF'
          const fs = require("fs");
          const http = require("http");
          const { chromium } = require("playwright");

          const packages = JSON.parse(
            fs.readFileSync("batch.json", "utf8")
          );

          fs.mkdirSync("results", {
            recursive: true
          });

          let currentPackage = null;

          const server = http.createServer((req, res) => {
            if (req.url !== "/") {
              res.writeHead(404);
              res.end();
              return;
            }

            const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">

            <script src="https://chibbit-99.github.io/arch.js/releases/latest.js"></script>
          </head>

          <body>

          <script type="module">

          window.__ARCH_TEST__ = {
            done: false,
            status: "running",
            error: null,
            loadTime: null,
            exports: []
          };

          (async () => {

            const started = performance.now();

            try {

              const result = await importPackage(
                ${JSON.stringify(currentPackage)}
              );

              window.__ARCH_TEST__ = {
                done: true,
                status: "passed",
                error: null,
                loadTime: performance.now() - started,
                exports:
                  result &&
                  typeof result === "object"
                    ? Object.keys(result)
                    : []
              };

            } catch (error) {

              window.__ARCH_TEST__ = {
                done: true,
                status: "failed",
                error: String(
                  error?.stack ||
                  error?.message ||
                  error
                ).slice(0, 10000),
                loadTime: performance.now() - started,
                exports: []
              };

            }

          })();

          </script>

          </body>
          </html>`;

            res.writeHead(200, {
              "Content-Type": "text/html"
            });

            res.end(html);
          });

          await new Promise(resolve => {
            server.listen(
              4173,
              "127.0.0.1",
              resolve
            );
          });

          console.log(
            "Test server running on http://127.0.0.1:4173"
          );

          const browser = await chromium.launch({
            headless: true
          });

          const results = [];

          for (
            let i = 0;
            i < packages.length;
            i++
          ) {

            currentPackage = packages[i];

            console.log("");
            console.log(
              `[${i + 1}/${packages.length}] ${currentPackage}`
            );

            const started = Date.now();

            try {

              await pageGoto();

              const result =
                await waitForResult();

              results.push({
                package: currentPackage,
                status: result.status,
                error: result.error,
                loadTime: result.loadTime,
                exports: result.exports,
                testedAt:
                  new Date().toISOString()
              });

              console.log(
                `Result: ${result.status}`
              );

            } catch (error) {

              results.push({
                package: currentPackage,
                status: "timeout",
                error: String(error),
                loadTime: null,
                exports: [],
                testedAt:
                  new Date().toISOString()
              });

              console.log(
                "Result: timeout/error"
              );
            }
          }

          async function pageGoto() {

            if (!global.page) {

              global.page =
                await browser.newPage();

            }

            await global.page.goto(
              "http://127.0.0.1:4173/",
              {
                waitUntil: "domcontentloaded",
                timeout: 30000
              }
            );
          }

          async function waitForResult() {

            await global.page.waitForFunction(
              () =>
                window.__ARCH_TEST__ &&
                window.__ARCH_TEST__.done === true,
              {
                timeout: 60000
              }
            );

            return await global.page.evaluate(
              () => window.__ARCH_TEST__
            );
          }

          await browser.close();

          server.close();

          const timestamp =
            new Date()
              .toISOString()
              .replace(/[:.]/g, "-");

          const output =
            `results/${timestamp}.json`;

          fs.writeFileSync(
            output,
            JSON.stringify(
              results,
              null,
              2
            )
          );

          const passed =
            results.filter(
              x => x.status === "passed"
            ).length;

          const failed =
            results.filter(
              x => x.status === "failed"
            ).length;

          const timeout =
            results.filter(
              x => x.status === "timeout"
            ).length;

          console.log("");
          console.log(
            "================================"
          );
          console.log(
            "       ARCH.js RESULTS"
          );
          console.log(
            "================================"
          );
          console.log(
            `Packages: ${results.length}`
          );
          console.log(
            `Passed:   ${passed}`
          );
          console.log(
            `Failed:   ${failed}`
          );
          console.log(
            `Timeout:  ${timeout}`
          );
          console.log(
            "================================"
          );

          console.log(
            `Results saved to ${output}`
          );
          EOF

      - name: Update progress
        run: |
          node <<'EOF'
          const fs = require("fs");

          const batch = JSON.parse(
            fs.readFileSync(
              "batch.json",
              "utf8"
            )
          );

          let offset = 0;

          if (fs.existsSync("progress.json")) {

            const progress = JSON.parse(
              fs.readFileSync(
                "progress.json",
                "utf8"
              )
            );

            offset = progress.offset || 0;
          }

          const newOffset =
            offset + batch.length;

          const progress = {
            offset: newOffset,
            lastRun:
              new Date().toISOString(),
            packagesTested:
              newOffset
          };

          fs.writeFileSync(
            "progress.json",
            JSON.stringify(
              progress,
              null,
              2
            ) + "\n"
          );

          console.log(
            `Progress: ${newOffset} packages processed`
          );
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results/ \
            progress.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit \
              -m "chore: test next npm compatibility batch"

            git push
          fi
