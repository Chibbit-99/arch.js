name: One-time homepage playground sizing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run targeted homepage playground sizing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '.package-grid{display:grid;grid-template-columns:1fr}.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-bottom:1px solid rgba(241,235,227,.09)}.terminal{height:360px;overflow:auto;margin:0;padding:20px;color:#C9BFB2;font:12px/1.65 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap}.compiled-panel{background:#1B1815}.compiled-output{display:block;width:100%;height:360px;resize:none;border:0;outline:0;background:transparent;color:#C9BFB2;padding:20px;font:12px/1.55 "SFMono-Regular",Consolas,monospace}.compiled-empty{height:360px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#8F8477;font-size:14px}.compiled-actions{display:flex;gap:10px;padding:0 20px 20px}.package-demo .button{padding:9px 15px;font-size:14px}'
          new = '.package-grid{display:grid;grid-template-columns:1fr 1fr}.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-right:1px solid rgba(241,235,227,.09)}.terminal{height:270px;overflow:auto;margin:0;padding:20px;color:#C9BFB2;font:12px/1.65 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap}.compiled-panel{background:#1B1815}.compiled-output{display:block;width:100%;height:270px;resize:none;border:0;outline:0;background:transparent;color:#C9BFB2;padding:20px;font:12px/1.55 "SFMono-Regular",Consolas,monospace}.compiled-empty{height:270px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#8F8477;font-size:14px}.compiled-actions{grid-column:1/-1;display:flex;gap:10px;padding:14px 20px 20px;border-top:1px solid rgba(241,235,227,.09)}.package-demo .button{padding:9px 15px;font-size:14px}'
          if old not in s:
              raise SystemExit('expected playground CSS not found')
          s = s.replace(old, new, 1)

          old_html = '<div class="compiled-panel"><div class="panel-head"><span class="dot"></span><span>Compiled JavaScript</span></div><div class="compiled-empty" id="compiled-empty">Run a package to inspect the generated browser code.</div><textarea id="compiled-output" class="compiled-output" readonly hidden></textarea><div class="compiled-actions"><button id="compiled-view" class="button secondary" type="button" hidden>View compiled JS</button><button id="compiled-copy" class="button secondary" type="button" hidden>Copy compiled JS</button></div></div>'
          new_html = '<div class="compiled-panel"><div class="panel-head"><span class="dot"></span><span>Compiled JavaScript</span></div><div class="compiled-empty" id="compiled-empty">Run a package to inspect the generated browser code.</div><textarea id="compiled-output" class="compiled-output" readonly hidden></textarea></div><div class="compiled-actions"><button id="compiled-view" class="button secondary" type="button" hidden>View compiled JS</button><button id="compiled-copy" class="button secondary" type="button" hidden>Copy compiled JS</button></div>'
          if old_html not in s:
              raise SystemExit('expected playground HTML not found')
          s = s.replace(old_html, new_html, 1)

          mobile_old = '.footer-grid{grid-template-columns:1fr 1fr}}'
          mobile_new = '.footer-grid{grid-template-columns:1fr 1fr}.package-grid{grid-template-columns:1fr}.terminal-panel{border-right:0;border-bottom:1px solid rgba(241,235,227,.09)}}'
          if mobile_old in s and '.package-grid{grid-template-columns:1fr}' not in s[s.index('@media(max-width:900px)'):s.index('@media(max-width:560px)')]:
              s = s.replace(mobile_old, mobile_new, 1)

          p.write_text(s)
          PY
          git diff --check
          grep -q '.package-grid{display:grid;grid-template-columns:1fr 1fr}' index.html
          grep -q 'grid-column:1/-1' index.html
          grep -q 'height:270px' index.html
          git config user.name "ARCH.js updater"
          git config user.email "arch-updater@localhost"
          git add index.html
          git rm .github/workflows/tighten-homepage-playground.yml
          git commit -m "Tighten homepage playground layout"
          git push origin HEAD:main
