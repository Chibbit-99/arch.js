name: One-time homepage edit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  edit:
    if: github.event.head_commit.message == 'Run targeted homepage edit for npm package playground'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css = '''\n.package-demo{background:#211D19;border:1px solid rgba(241,235,227,.09);border-radius:22px 22px 22px 4px;overflow:hidden}.package-bar{display:flex;gap:10px;padding:18px;border-bottom:1px solid rgba(241,235,227,.09);background:rgba(20,18,15,.45)}.package-input{flex:1;min-width:0;background:#14120F;border:1px solid rgba(241,235,227,.09);border-radius:6px;padding:12px 14px;color:#F1EBE3;font:15px \"SFMono-Regular\",Consolas,monospace;outline:none}.package-input:focus{border-color:rgba(198,97,63,.55)}.package-grid{display:grid;grid-template-columns:1fr 1fr}.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-right:1px solid rgba(241,235,227,.09)}.terminal{height:360px;overflow:auto;margin:0;padding:20px;color:#C9BFB2;font:12px/1.65 \"SFMono-Regular\",Consolas,monospace;white-space:pre-wrap}.compiled-panel{background:#1B1815}.compiled-output{display:block;width:100%;height:360px;resize:none;border:0;outline:0;background:transparent;color:#C9BFB2;padding:20px;font:12px/1.55 \"SFMono-Regular\",Consolas,monospace}.compiled-empty{height:360px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#8F8477;font-size:14px}.compiled-actions{display:flex;gap:10px;padding:0 20px 20px}.package-demo .button{padding:9px 15px;font-size:14px}@media(max-width:900px){.package-grid{grid-template-columns:1fr}.terminal-panel{border-right:0;border-bottom:1px solid rgba(241,235,227,.09)}}@media(max-width:560px){.package-bar{flex-direction:column}.package-bar .button{width:100%}}\n'''
          if '.package-demo{' in s:
              raise SystemExit('package playground CSS already present')
          s = s.replace('</style>', css + '</style>', 1)

          marker = '<div class="container"><div class="rule"></div></div>\n<section class="section"><div class="section-head"><h2>Build with packages, not restrictions</h2>'
          section = '''<div class="container"><div class="rule"></div></div>\n<section class="section" id="package-playground"><div class="section-head"><h2>Bring an npm package into the browser</h2><p>Enter a package name and watch ARCH.js resolve, compile, and load it in real time.</p></div><div class="container"><div class="package-demo"><div class="package-bar"><input id="package-name" class="package-input" type="text" value="three" placeholder="npm package name" autocomplete="off" spellcheck="false"><button id="package-run" class="button primary" type="button">Install package</button></div><div class="package-grid"><div class="terminal-panel"><div class="panel-head"><span class="dot"></span><span>ARCH.js output</span></div><pre id="package-logs" class="terminal"></pre></div><div class="compiled-panel"><div class="panel-head"><span class="dot"></span><span>Compiled JavaScript</span></div><div class="compiled-empty" id="compiled-empty">Run a package to inspect the generated browser code.</div><textarea id="compiled-output" class="compiled-output" readonly hidden></textarea><div class="compiled-actions"><button id="compiled-view" class="button secondary" type="button" hidden>View compiled JS</button><button id="compiled-copy" class="button secondary" type="button" hidden>Copy compiled JS</button></div></div></div></div></div></section>\n<div class="container"><div class="rule"></div></div>\n<section class="section"><div class="section-head"><h2>Build with packages, not restrictions</h2>'''
          if marker not in s:
              raise SystemExit('homepage insertion marker not found')
          s = s.replace(marker, section, 1)

          script = '''<script>\n(() => {\n  const input = document.getElementById("package-name");\n  const run = document.getElementById("package-run");\n  const logs = document.getElementById("package-logs");\n  const output = document.getElementById("compiled-output");\n  const empty = document.getElementById("compiled-empty");\n  const view = document.getElementById("compiled-view");\n  const copy = document.getElementById("compiled-copy");\n  let loaderPromise = null;\n  let compiledCode = "";\n  function formatArg(value) { if (typeof value === "string") return value; try { return JSON.stringify(value); } catch { return String(value); } }\n  function appendLog(kind, args) { logs.textContent += `[${kind}] ${args.map(formatArg).join(" \")}\\n`; logs.scrollTop = logs.scrollHeight; }\n  async function ensureARCH() {\n    if (typeof globalThis.importPackage === "function") return;\n    if (loaderPromise) return loaderPromise;\n    loaderPromise = new Promise((resolve, reject) => {\n      const script = document.createElement("script");\n      script.src = "https://chibbit-99.github.io/arch.js/releases/latest.js?homepage-demo";\n      script.onload = resolve;\n      script.onerror = () => reject(new Error("Failed to load ARCH.js"));\n      document.head.appendChild(script);\n    });\n    return loaderPromise;\n  }\n  async function install() {\n    const specifier = input.value.trim();\n    if (!specifier) return;\n    run.disabled = true; run.textContent = "Installing..."; logs.textContent = ""; output.value = ""; output.hidden = true; empty.hidden = false; view.hidden = true; copy.hidden = true;\n    const original = {log: console.log, warn: console.warn, error: console.error};\n    const write = (kind, args, fn) => { appendLog(kind, args); fn(...args); };\n    console.log = (...args) => write("LOG", args, original.log);\n    console.warn = (...args) => write("WARN", args, original.warn);\n    console.error = (...args) => write("ERROR", args, original.error);\n    try {\n      await ensureARCH();\n      const module = await globalThis.importPackage(specifier);\n      const entries = [...globalThis.ARCH.blobs.entries()].filter(([, value]) => value && value.packageURL);\n      const entry = entries.find(([key]) => key.startsWith(`${specifier}@`)) || entries.at(-1);\n      if (!entry) throw new Error("ARCH loaded the package but its compiled blob was not found.");\n      compiledCode = await fetch(entry[1].packageURL).then(async response => { if (!response.ok) throw new Error(`Compiled blob fetch failed: ${response.status}`); return response.text(); });\n      empty.hidden = true; output.value = compiledCode; view.hidden = false; copy.hidden = false;\n      appendLog("OK", [`Imported ${specifier}`, `Exports: ${Object.keys(module).join(", ")}`, `Compiled JavaScript ready (${compiledCode.length.toLocaleString()} characters)`]);\n    } catch (error) {\n      appendLog("ERROR", [error?.message || String(error)]);\n    } finally {\n      console.log = original.log; console.warn = original.warn; console.error = original.error; run.disabled = false; run.textContent = "Install package";\n    }\n  }\n  view.addEventListener("click", () => { output.hidden = !output.hidden; view.textContent = output.hidden ? "View compiled JS" : "Hide compiled JS"; });\n  copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(compiledCode); } catch { output.hidden = false; output.focus(); output.select(); document.execCommand("copy"); } copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy compiled JS", 1400); });\n  run.addEventListener("click", install);\n  input.addEventListener("keydown", event => { if (event.key === "Enter") install(); });\n})();\n</script>\n'''
          if '</body>' not in s:
              raise SystemExit('body marker not found')
          s = s.replace('</body>', script + '</body>', 1)
          p.write_text(s)
          PY
          node --check <(python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>\n(.*?)\n</script>',s,re.S)
          print(scripts[-1])
          PY
          )
          git diff --check
          test "$(grep -o 'id=\"package-playground\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"package-run\"' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"compiled-output\"' index.html | wc -l)" -eq 1
      - name: Commit targeted edit
        shell: bash
        run: |
          git config user.name "ARCH.js updater"
          git config user.email "arch-updater@localhost"
          git add index.html
          git rm .github/workflows/one-time-homepage-edit.yml
          git commit -m "Add interactive npm package playground"
          git push origin HEAD:main
