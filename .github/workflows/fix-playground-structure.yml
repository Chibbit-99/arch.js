name: One-time playground structure fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run playground structure fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          s = s.replace('revelant files', 'relevant files')

          old = '<div class="package-grid"><div class="terminal-panel"><div class="panel-head"><span>ARCH.js output</span></div><pre id="package-logs" class="terminal"></pre></div><div class="compiled-panel"><div class="panel-head"><span>Compiled JavaScript</span></div><div class="compiled-empty" id="compiled-empty">Run a package to inspect the generated browser code.</div><textarea id="compiled-output" class="compiled-output" readonly="" hidden=""></textarea></div><div class="compiled-actions"><button id="compiled-view" class="button secondary" type="button" hidden="">View compiled JS</button><button id="compiled-copy" class="button secondary" type="button" hidden="">Copy compiled JS</button></div></div>'
          new = '<div class="package-grid"><div class="terminal-panel"><div class="panel-head"><span>ARCH.js output</span></div><pre id="package-logs" class="terminal"></pre></div><div class="compiled-panel"><div class="panel-head"><span>Compiled JavaScript</span></div><div class="compiled-empty" id="compiled-empty">Run a package to inspect the generated browser code.</div><textarea id="compiled-output" class="compiled-output" readonly="" hidden=""></textarea></div></div><div class="compiled-actions"><button id="compiled-view" class="button secondary" type="button" hidden="">View compiled JS</button><button id="compiled-copy" class="button secondary" type="button" hidden="">Copy compiled JS</button></div>'
          if old not in s:
              raise SystemExit('expected playground HTML not found')
          s = s.replace(old, new, 1)

          old_css = '.package-grid{display:grid;grid-template-columns:1fr 1fr}.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-right:1px solid rgba(241,235,227,.09)}.terminal{height:270px;overflow:auto;margin:0;padding:20px;color:#C9BFB2;font:12px/1.65 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap}.compiled-panel{background:#1B1815}.compiled-output{display:block;width:100%;height:270px;resize:none;border:0;outline:0;background:transparent;color:#C9BFB2;padding:20px;font:12px/1.55 "SFMono-Regular",Consolas,monospace}.compiled-empty{height:270px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#8F8477;font-size:14px}.compiled-actions{grid-column:1/-1;display:flex;gap:10px;padding:14px 20px 20px;border-top:1px solid rgba(241,235,227,.09)}.package-demo .button{padding:9px 15px;font-size:14px}'
          new_css = '.package-grid{display:grid;grid-template-columns:1fr 1fr}.terminal-panel,.compiled-panel{min-width:0;background:rgba(20,18,15,.6)}.terminal-panel{border-right:1px solid rgba(241,235,227,.09)}.terminal{height:270px;overflow:auto;margin:0;padding:20px;color:#C9BFB2;font:12px/1.65 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap}.compiled-panel{background:#1B1815}.compiled-output{display:block;width:100%;height:270px;resize:none;border:0;outline:0;background:transparent;color:#C9BFB2;padding:20px;font:12px/1.55 "SFMono-Regular",Consolas,monospace}.compiled-empty{height:270px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#8F8477;font-size:14px}.compiled-actions{display:flex;gap:10px;padding:14px 20px 20px;border-top:1px solid rgba(241,235,227,.09)}.package-demo .button{padding:9px 15px;font-size:14px}'
          if old_css not in s:
              raise SystemExit('expected playground CSS not found')
          s = s.replace(old_css, new_css, 1)

          p.write_text(s)
          PY

          git diff --check
          grep -q 'relevant files' index.html
          grep -q '<div class="package-grid"><div class="terminal-panel"' index.html
          grep -q '</div><div class="compiled-actions"><button id="compiled-view"' index.html
          grep -q '.compiled-actions{display:flex' index.html

          git config user.name "ARCH.js updater"
          git config user.email "arch-updater@localhost"
          git add index.html
          git rm .github/workflows/fix-playground-structure.yml
          git rm playground-fix-trigger.txt || true
          git commit -m "Fix playground two-column layout and typo"
          git push origin HEAD:main
